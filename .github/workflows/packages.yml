name: Desktop packages (.deb, Windows setup, macOS .dmg)
# Linux/Windows: the Qt app with Python and Qt bundled. macOS: the SwiftUI app (the main
# macOS app). Manual run: the packages are attached to the workflow run. Tag v*: they are
# also attached to a draft release to review.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths: ["scripts/build_desktop.py", ".github/workflows/packages.yml", "robot_console.py", "qtui/bridge.py", "requirements.txt", "native/build.command", "native/Info.plist"]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04      # older glibc: the .deb also runs on newer Ubuntu/Debian
            files: dist/*.deb
          - os: windows-latest
            files: |
              dist/*-setup.exe
              dist/*.zip
          - os: macos-latest       # Apple Silicon · SwiftUI app
            files: dist/*.dmg
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libxcb-cursor0
      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
      - name: Qt and PyInstaller (Linux, Windows)
        if: runner.os != 'macOS'
        run: python -m pip install -r requirements.txt pyinstaller
      - run: python scripts/build_desktop.py --check
      - uses: actions/upload-artifact@v6
        with:
          name: robot-console-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: packages
          merge-multiple: true
      - name: Attach to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la packages
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" packages/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" packages/* --draft --title "Robot Console ${TAG#v}" \
              --notes "Pacchetti desktop: .deb (Linux) e setup .exe (Windows) con l'app Qt; .dmg (macOS) con l'app SwiftUI, firma ad-hoc. Vedi CHANGELOG.md." \
              --repo "$GITHUB_REPOSITORY"
          fi
