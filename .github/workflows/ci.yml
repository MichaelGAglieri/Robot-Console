name: Tests on macOS, Linux and Windows
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"   # same as the app: the controller runs in UTF-8 mode
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -r requirements.txt
      - run: python scripts/run_tests.py
  macos-native:
    # The original SwiftUI app stays available for macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - run: zsh native/build.command
      - run: codesign --verify --deep --strict "Robot Console.app"
      - name: Bundled controller answers (Python of the runner and the Mac's /usr/bin/python3)
        run: |
          for python in python3 /usr/bin/python3; do
            echo '{"op":"heartbeat"}' | DOC_REGIA_NO_HARDWARE=1 DOC_REGIA_DATA="$RUNNER_TEMP/data-$RANDOM" \
              "$python" -u "Robot Console.app/Contents/Resources/native_bridge.py" | head -n 1 | grep -q '"state"'
            echo "$python OK"
          done
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'Release Robot Console ')
    needs: [tests, macos-native]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - run: zsh native/build.command
      - run: python3 scripts/package_release.py
      - run: python3 scripts/publish_release.py
        env:
          GH_TOKEN: ${{ github.token }}
